<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>King Cage Korea</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/iris, /en/manything ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/kingcage/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/kingcage/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'titanium':'standard', 'titanium-cage':'standard', 'stainless':'standard', 'stainless-steel-cage':'standard', 'cage':'standard', 'cages':'range',
                'iris':'iris', 'flat-top':'iris', 'flattop':'iris',
                'side-loader':'fit', 'sideloader':'fit', 'lowering':'fit', 'bottle-lowering':'fit', 'raising':'fit', 'bottle-raising':'fit',
                'manything':'manything', 'many-things-cage':'manything', 'longer-thing':'manything', 'oliver':'manything', 'bikepacking':'manything',
                'top-cap-cage-mount':'mounts', 'tccm':'mounts', 'usb':'mounts', 'universal-support-bolt':'mounts', 'mount':'mounts', 'accessories':'mounts',
                'cage-guide':'guide', 'bottle-guide':'guide', 'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'lineup':'range' };
  var map = { brand:1, range:1, standard:1, iris:1, fit:1, manything:1, mounts:1, guide:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
